################################################################################
# level1-blind.ini - recovery configuration for the blinded level 1 reference
# posteriors. These results approximately reveal the hidden parameters, so keep
# them under the same access control as the unblinded truth.
#
# Run via run_reference_posteriors.py, which swaps the data-generation step for
# npz_generation.py so the strain is read from the level 1 npz files. The npz
# directory is passed on the command line, NOT in this file, e.g.:
#
#   ./run_reference_posteriors.py level1-blind.ini --npz-directory /path/to/level1-blind
################################################################################

# --- bookkeeping ---
label  = level1-blind
outdir = outdir_level1-blind

# --- scheduler ---
# slurm for now; change to condor on an HTCondor cluster.
# Comment in the scheduler you want
# scheduler = slurm
# scheduler = condor
# accounting = <your.accounting.tag>          # required on IGWN/LIGO clusters
# For a quick local test instead of cluster submission, set: local = True
request-cpus = 8

# --- data ---
# Strain is read from the npz files by npz_generation.py, one per event. We keep
# gaussian-noise=True and injection=False so bilby_pipe dispatches to the method
# we override: no noise is simulated and no signal is injected.
gaussian-noise = True
injection      = False
n-simulation   = 10         # TEMPORARY: first 10 events for a sanity check; 1000 = full set

# No trigger-time: each level 1 event has its own. run_reference_posteriors.py
# reads trigger_time from injection_metadata.parquet and passes it to that
# event's generation job, which sets the segment start
# (trigger_time + post-trigger-duration - duration) and the geocent_time prior.
post-trigger-duration = 2

# geocent_time is left out of the prior file, so bilby_pipe adds
# Uniform(trigger_time - deltaT/2, trigger_time + deltaT/2) for each event. With
# deltaT = 0.2 this is exactly the generation prior trigger_time + U(-0.1, 0.1).
deltaT         = 0.2
time-reference = geocent

# --- detectors / data conditioning ---
# Each event holds its own network (H1L1V1, H1L1 or H1); only the detectors in
# its npz file are loaded and analysed, and its jobs are labelled to match.
detectors          = [H1, L1, V1]
duration           = 8
sampling-frequency = 2048
minimum-frequency  = 20
maximum-frequency  = 1024

# --- prior: exactly the prior the data were generated with ---
# Built from configs/gwbenchmark2g/level1.yaml with build_prior.py --level 1.
prior-file = level1_recovery.prior

# --- waveform: IMRPhenomXHM (higher modes) to match the level 1 events ---
frequency-domain-source-model = lal_binary_black_hole
waveform-approximant          = IMRPhenomXHM
reference-frequency           = 50

# --- likelihood: marginalise over luminosity distance only ---
# Phase marginalisation is not valid with higher-mode waveforms.
likelihood-type          = GravitationalWaveTransient
distance-marginalization = True
phase-marginalization    = False
time-marginalization     = False

# --- sampler: same settings as level 0 ---
sampler        = dynesty
sampler-kwargs = {sample: acceptance-walk, naccept: 60, maxmcmc: 5000, nlive: 1000}
