################################################################################
# level0.ini - recovery configuration for the level 0 reference posteriors.
#
# Run via run_reference_posteriors.py, which swaps the data-generation step for
# npz_generation.py so the strain is read from the level 0 npz files. The npz
# directory is passed on the command line, NOT in this file, e.g.:
#
#   ./run_reference_posteriors.py level0.ini --npz-directory /path/to/level0
################################################################################

# --- bookkeeping ---
label  = level0
outdir = outdir_level0

# --- scheduler ---
# slurm for now; change to condor on an HTCondor cluster.
scheduler = slurm
# accounting = <tag>          # required on IGWN/LIGO clusters
# For a quick local test instead of cluster submission, set: local = True

# --- data ---
# Strain is read from the npz files by npz_generation.py, one per event. We keep
# gaussian-noise=True and injection=False so bilby_pipe dispatches to the method
# we override: no noise is simulated and no signal is injected.
gaussian-noise = True
injection      = False
n-simulation   = 1000       # events idx 0..N-1 -> simulation_<idx>.npz; 1000 = full non-blind set

# Every level 0 event shares the same fixed geocent_time, so one trigger-time is
# correct for all of them.
trigger-time   = -0.01621880385450652

# --- detectors / data conditioning ---
detectors          = [H1, L1, V1]
duration           = 8
sampling-frequency = 2048
minimum-frequency  = 20
maximum-frequency  = 1024

# --- prior: exactly the prior the data were generated with ---
prior-file = level0_recovery.prior

# --- waveform: IMRPhenomXAS to match the (regenerated) level 0 events ---
frequency-domain-source-model = lal_binary_black_hole
waveform-approximant          = IMRPhenomXAS
reference-frequency           = 50

# --- likelihood: marginalise over luminosity distance only ---
likelihood-type          = GravitationalWaveTransient
distance-marginalization = True
phase-marginalization    = False
time-marginalization     = False

# --- sampler ---
sampler        = dynesty
sampler-kwargs = {sample: acceptance-walk, naccept: 60, maxmcmc: 5000, nlive: 1000}
